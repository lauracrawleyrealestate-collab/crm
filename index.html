<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<title>Crawley CRM</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crawley CRM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ======================= SIGN IN ======================= -->
<div id="signin" class="signin">
  <div class="signin-card">
    <div class="brand-mark">C21</div>
    <h1>Crawley CRM</h1>
    <p class="signin-sub">Your pipeline, your contacts, your data — stored in your own Google&nbsp;Drive.</p>
    <button id="btn-signin" class="btn btn-primary btn-lg">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#fff" d="M12 11v2.6h6.1c-.25 1.6-1.86 4.7-6.1 4.7A6.8 6.8 0 0 1 12 5.2c1.94 0 3.24.83 3.99 1.54l2.72-2.62A9.7 9.7 0 0 0 12 1.6 10.4 10.4 0 1 0 12 22.4c6 0 9.98-4.22 9.98-10.16 0-.68-.07-1.2-.17-1.72Z"/></svg>
      Sign in with Google
    </button>
    <div id="signin-error" class="signin-error" hidden></div>
    <p class="signin-foot">Nothing is sent anywhere except your own Google account.</p>
  </div>
</div>

<!-- ======================= APP ======================= -->
<div id="app" hidden>

  <header class="topbar">
    <div class="topbar-left">
      <div class="brand-mark sm">C21</div>
      <span class="topbar-title">Crawley CRM</span>
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="pipeline">Pipeline</button>
      <button class="tab" data-view="contacts">Contacts</button>
      <button class="tab" data-view="dashboard">Dashboard</button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>

    <div class="topbar-right">
      <button id="btn-refresh" class="icon-btn" title="Reload from Google Sheets">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg>
      </button>
      <button id="btn-user" class="user-chip" title="Account"><span id="user-initial">?</span></button>
    </div>
  </header>

  <!-- ---------------- PIPELINE ---------------- -->
  <main id="view-pipeline" class="view">
    <div class="view-bar">
      <div class="seg" id="pipeline-seg"></div>
      <div class="view-bar-right">
        <input id="board-search" class="search" type="search" placeholder="Search deals…">
        <label class="check"><input type="checkbox" id="show-closed"> <span>Show closed</span></label>
        <button class="btn btn-primary" id="btn-new-deal">+ New Deal</button>
      </div>
    </div>
    <div id="board" class="board"></div>
  </main>

  <!-- ---------------- CONTACTS ---------------- -->
  <main id="view-contacts" class="view" hidden>
    <div class="view-bar">
      <div class="seg" id="contact-seg">
        <button data-cmode="crm" class="active">My CRM</button>
        <button data-cmode="google">All Google Contacts</button>
      </div>
      <div class="view-bar-right">
        <input id="contact-search" class="search wide" type="search" placeholder="Search name, email, phone, address, tag…">
        <select id="contact-filter" class="select"></select>
        <button class="btn" id="btn-sync-contacts" title="Re-read Google Contacts">Sync</button>
        <button class="btn btn-primary" id="btn-new-contact">+ New Contact</button>
      </div>
    </div>
    <div id="contact-list" class="contact-list"></div>
  </main>

  <!-- ---------------- DASHBOARD ---------------- -->
  <main id="view-dashboard" class="view" hidden>
    <div id="dashboard" class="dashboard"></div>
  </main>

  <!-- ---------------- SETTINGS ---------------- -->
  <main id="view-settings" class="view" hidden>
    <div id="settings" class="settings"></div>
  </main>
</div>

<!-- ======================= DRAWER / MODAL / TOAST ======================= -->
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Details"></aside>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<div id="loader" class="loader" hidden><div class="spinner"></div><span id="loader-text">Loading…</span></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/config.js"></script>
<script src="js/google.js"></script>
<script src="js/people.js"></script>
<script src="js/store.js"></script>
<script src="js/import.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
